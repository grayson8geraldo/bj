<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BJ Advisor</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --dim: #8b949e;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --blue: #58a6ff;
  --purple: #bc8cff;
  --cyan: #39d2c0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'SF Pro', 'Segoe UI', Roboto, monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ── Top bar ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  display: flex; gap: 10px; align-items: center;
  flex-wrap: wrap;
}
.stat {
  display: flex; flex-direction: column; align-items: center;
  min-width: 52px;
}
.stat-label { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-value.positive { color: var(--green); }
.stat-value.negative { color: var(--red); }
.stat-value.neutral { color: var(--yellow); }

/* ── Sections ── */
.section {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}
.section-title {
  font-size: 11px; color: var(--dim); text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 8px;
}

/* ── Action display ── */
.action-display {
  text-align: center; padding: 16px 12px;
  min-height: 80px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.action-main {
  font-size: 36px; font-weight: 900; letter-spacing: 2px;
}
.action-sub { font-size: 13px; color: var(--dim); margin-top: 4px; }
.action-hit { color: var(--yellow); }
.action-stand { color: var(--green); }
.action-double { color: var(--purple); }
.action-split { color: var(--cyan); }
.action-surrender { color: var(--red); }

/* ── Shuffle signal banner ── */
.shuffle-signal {
  text-align: center; padding: 8px;
  font-weight: 700; font-size: 14px;
  display: none;
}
.shuffle-signal.big { display: block; background: #1a3a1a; color: var(--green); }
.shuffle-signal.min { display: block; background: #3a1a1a; color: var(--red); }

/* ── Card buttons ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  padding: 8px 0;
}
.card-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 18px; font-weight: 700;
  padding: 14px 0;
  text-align: center;
  cursor: pointer;
  transition: all 0.1s;
  -webkit-user-select: none; user-select: none;
}
.card-btn:active { background: var(--blue); transform: scale(0.95); }
.card-btn.selected { background: var(--blue); border-color: var(--blue); }

/* ── Input mode tabs ── */
.tabs {
  display: flex; gap: 4px; margin-bottom: 10px;
}
.tab {
  flex: 1; padding: 10px 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--dim);
  font-size: 12px; font-weight: 600;
  text-align: center; cursor: pointer;
  transition: all 0.15s;
}
.tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }

/* ── Input area ── */
.input-area {
  padding: 12px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.input-row {
  display: flex; gap: 8px; align-items: center;
  margin-bottom: 8px;
}
.input-label {
  font-size: 12px; color: var(--dim); width: 60px; flex-shrink: 0;
}
.selected-cards {
  flex: 1; font-size: 16px; font-weight: 600;
  min-height: 24px; color: var(--cyan);
}

/* ── Action buttons ── */
.btn-row {
  display: flex; gap: 8px; margin-top: 8px;
}
.btn {
  flex: 1; padding: 12px 8px;
  border: none; border-radius: 8px;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.1s;
  text-transform: uppercase;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-success { background: var(--green); color: #000; }
.btn-danger { background: var(--red); color: #fff; }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-warn { background: var(--yellow); color: #000; }
.btn:disabled { opacity: 0.3; }

/* ── Seat rows ── */
.seat-row {
  display: flex; gap: 8px; align-items: center;
  padding: 6px 8px; border-radius: 6px;
  cursor: pointer; transition: background 0.15s;
  min-height: 32px;
}
.seat-row:active { background: rgba(88, 166, 255, 0.08); }
.seat-row.active { background: rgba(88, 166, 255, 0.12); }
.seat-indicator {
  width: 14px; font-size: 12px; color: var(--blue);
  flex-shrink: 0; text-align: center;
}
.seat-label {
  font-size: 12px; color: var(--dim); width: 75px; flex-shrink: 0;
}
.seat-row.my-seat .seat-label { color: var(--cyan); font-weight: 700; }
.seat-cards {
  flex: 1; font-size: 16px; font-weight: 600; color: var(--text);
  min-height: 20px;
}
.seat-row.my-seat .seat-cards { color: var(--cyan); }
.seat-clear {
  flex: 0; padding: 4px 8px; font-size: 11px;
  background: var(--border); border: none; border-radius: 4px;
  color: var(--dim); cursor: pointer;
}
.seat-clear:active { background: var(--blue); color: #fff; }
.dealer-row .seat-label { color: var(--yellow); }
.dealer-row .seat-cards { color: var(--yellow); }

/* ── Log ── */
.log {
  padding: 8px 12px;
  max-height: 200px; overflow-y: auto;
}
.log-entry {
  font-size: 12px; color: var(--dim);
  padding: 3px 0;
  border-bottom: 1px solid #21262d;
}
.log-entry.important { color: var(--text); font-weight: 600; }
.log-entry.good { color: var(--green); }
.log-entry.bad { color: var(--red); }
.log-entry.alert { color: var(--yellow); }

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 200;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px; width: 100%; max-width: 400px;
}
.modal h3 { margin-bottom: 16px; }
.modal-field {
  margin-bottom: 12px;
}
.modal-field label {
  display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px;
}
.modal-field select, .modal-field input {
  width: 100%; padding: 10px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 16px;
}

/* ── Predictions panel ── */
.prediction-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 6px; margin-bottom: 4px;
  font-size: 13px;
}
.prediction-row.favorable { background: #1a3a1a; }
.prediction-row.unfavorable { background: #3a1a1a; }
.prediction-row.current { border: 2px solid var(--blue); }
.pred-section { font-weight: 700; width: 20px; }
.pred-count { width: 50px; font-variant-numeric: tabular-nums; }
.pred-conf { color: var(--dim); font-size: 11px; }
.pred-tag {
  font-size: 10px; font-weight: 700; padding: 2px 6px;
  border-radius: 4px; margin-left: auto;
}
.pred-tag.rich { background: var(--green); color: #000; }
.pred-tag.poor { background: var(--red); color: #fff; }
.pred-tag.noriff { background: var(--purple); color: #fff; }

/* ── Zones panel ── */
.zone-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 8px; font-size: 12px; margin-bottom: 2px;
}
.zone-indicator {
  width: 8px; height: 8px; border-radius: 50%;
}
.zone-indicator.fav { background: var(--green); }
.zone-indicator.unfav { background: var(--red); }
.zone-indicator.neut { background: var(--dim); }

/* ── Setup modal ── */
#setup-modal .modal { text-align: center; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Wong badge ── */
.wong-badge {
  padding: 2px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 700;
  text-transform: uppercase;
}
.wong-play { background: var(--green); color: #000; }
.wong-sit_out { background: var(--yellow); color: #000; }
.wong-leave { background: var(--red); color: #fff; }

/* ── Responsive ── */
@media (min-width: 600px) {
  body { max-width: 500px; margin: 0 auto; }
}
</style>
</head>
<body>

<!-- ── Top Status Bar ── -->
<div class="topbar" id="topbar">
  <div class="stat">
    <span class="stat-label">TC</span>
    <span class="stat-value neutral" id="tc">0.0</span>
  </div>
  <div class="stat">
    <span class="stat-label">RC</span>
    <span class="stat-value" id="rc">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">Edge</span>
    <span class="stat-value" id="edge">-0.43%</span>
  </div>
  <div class="stat">
    <span class="stat-label">Bet</span>
    <span class="stat-value" id="bet">$10</span>
  </div>
  <div class="stat">
    <span class="stat-label">Bank</span>
    <span class="stat-value" id="bankroll">$1000</span>
  </div>
  <div class="stat">
    <span class="stat-label">Pen</span>
    <span class="stat-value" id="pen">0%</span>
  </div>
  <div id="wong-container" class="stat">
    <span class="wong-badge wong-leave" id="wong">LEAVE</span>
  </div>
</div>

<!-- ── Shuffle Tracking Signal ── -->
<div class="shuffle-signal" id="shuffle-signal"></div>

<!-- ── Action Display ── -->
<div class="action-display section" id="action-area">
  <div class="action-sub">Начни новую руку</div>
</div>

<!-- ── Mode Tabs ── -->
<div class="section" style="padding-bottom:0">
  <div class="tabs">
    <div class="tab active" data-mode="hand" onclick="setMode('hand')">Рука</div>
    <div class="tab" data-mode="count" onclick="setMode('count')">Счёт</div>
    <div class="tab" data-mode="result" onclick="setMode('result')">Итог</div>
    <div class="tab" data-mode="shuffle" onclick="setMode('shuffle')">Шафл</div>
    <div class="tab" data-mode="zones" onclick="setMode('zones')">Зоны</div>
  </div>
</div>

<!-- ═══════ HAND MODE ═══════ -->
<div class="section mode-panel" id="mode-hand">
  <div id="seats-container"></div>
  <div class="card-grid" id="hand-card-grid"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btn-deal" onclick="dealHand()">Раздача</button>
    <button class="btn btn-warn" id="btn-hit" onclick="hitCard()" disabled>Хит</button>
    <button class="btn btn-secondary" onclick="clearAllSeats()" style="flex:0;padding:12px 14px;font-size:12px">C</button>
  </div>
</div>

<!-- ═══════ COUNT MODE ═══════ -->
<div class="section mode-panel" id="mode-count" style="display:none">
  <div class="input-row">
    <span class="input-label">Карты:</span>
    <span class="selected-cards" id="count-display">—</span>
    <button class="btn btn-secondary" style="flex:0;padding:8px 12px;font-size:12px" onclick="clearCountCards()">C</button>
  </div>
  <div class="card-grid" id="count-card-grid"></div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="submitCount()">Считать</button>
    <button class="btn btn-danger" onclick="resetShoe()">Новый шуз</button>
  </div>
</div>

<!-- ═══════ RESULT MODE ═══════ -->
<div class="section mode-panel" id="mode-result" style="display:none">
  <div style="text-align:center;margin:12px 0">
    <div style="font-size:13px;color:var(--dim);margin-bottom:8px">Результат руки</div>
    <div class="btn-row" style="max-width:320px;margin:0 auto">
      <button class="btn btn-success" onclick="submitResult('win')">Win</button>
      <button class="btn btn-danger" onclick="submitResult('loss')">Loss</button>
      <button class="btn btn-secondary" onclick="submitResult('push')">Push</button>
      <button class="btn btn-success" onclick="submitResult('bj')">BJ!</button>
    </div>
    <div style="margin-top:16px">
      <div style="font-size:11px;color:var(--dim);margin-bottom:4px">Или точная сумма:</div>
      <div class="input-row" style="justify-content:center">
        <input type="number" id="result-amount" placeholder="напр. 25 или -50"
               style="width:120px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;text-align:center">
        <button class="btn btn-primary" style="flex:0;padding:10px 16px" onclick="submitResultCustom()">OK</button>
      </div>
    </div>
  </div>
  <div style="margin-top:12px">
    <div class="section-title">Статистика</div>
    <div id="stats-display" style="font-size:13px;color:var(--dim)"></div>
  </div>
</div>

<!-- ═══════ SHUFFLE MODE ═══════ -->
<div class="section mode-panel" id="mode-shuffle" style="display:none">
  <div id="predictions-panel"></div>
  <div class="btn-row" style="margin-bottom:12px">
    <button class="btn btn-primary" onclick="openShuffleModal()">Шафл анализ</button>
    <button class="btn btn-secondary" onclick="nextSection()">След. секция</button>
  </div>
</div>

<!-- ═══════ ZONES MODE ═══════ -->
<div class="section mode-panel" id="mode-zones" style="display:none">
  <div id="zones-panel"></div>
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="loadZones()">Обновить</button>
  </div>
</div>

<!-- ── Log ── -->
<div class="section">
  <div class="section-title">Лог</div>
  <div class="log" id="log"></div>
</div>

<!-- ═══════ SHUFFLE MODAL ═══════ -->
<div class="modal-overlay" id="shuffle-modal">
  <div class="modal">
    <h3>Анализ шаффла</h3>
    <div class="modal-field">
      <label>Сколько стопок?</label>
      <select id="shuf-stacks">
        <option value="2" selected>2 стопки</option>
        <option value="3">3 стопки</option>
        <option value="4">4 стопки</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Рифлов на пару?</label>
      <select id="shuf-riffles">
        <option value="1">1 рифл</option>
        <option value="2" selected>2 рифла</option>
        <option value="3">3 рифла</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Качество рифла</label>
      <select id="shuf-quality">
        <option value="sloppy" selected>Небрежный (sloppy)</option>
        <option value="average">Средний (average)</option>
        <option value="good">Хороший (good)</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Strip cut?</label>
      <select id="shuf-strip">
        <option value="true" selected>Да</option>
        <option value="false">Нет</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="submitShuffle()">Анализировать</button>
      <button class="btn btn-secondary" onclick="closeShuffleModal()">Отмена</button>
    </div>
  </div>
</div>

<!-- ═══════ SETUP MODAL ═══════ -->
<div class="modal-overlay open" id="setup-modal">
  <div class="modal">
    <h3>Blackjack Advisor</h3>
    <div class="modal-field">
      <label>Банкролл ($)</label>
      <input type="number" id="setup-bankroll" value="1000">
    </div>
    <div class="modal-field">
      <label>Мин. ставка ($)</label>
      <input type="number" id="setup-min" value="10">
    </div>
    <div class="modal-field">
      <label>Макс. ставка ($)</label>
      <input type="number" id="setup-max" value="500">
    </div>
    <div class="modal-field">
      <label>Игроков за столом (включая тебя)</label>
      <select id="setup-seats" onchange="updateSeatOptions()">
        <option value="1" selected>1 (только я)</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>
    </div>
    <div class="modal-field" id="my-seat-field" style="display:none">
      <label>Моё место (бокс)</label>
      <select id="setup-my-seat">
        <option value="1">1</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-success" onclick="initSession()" style="font-size:18px;padding:16px">Начать</button>
    </div>
  </div>
</div>

<script>
// ── State ──
let SID = null;
const CARDS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
let currentMode = 'hand';
let countCards = [];
let hitMode = false;

// ── Multi-seat state ──
let numSeats = 1;
let mySeat = 1;
let seatCards = {};   // {1: ['8','Q'], 2: ['A','5'], ...}
let dealerCard = null;
let activeSeatIndex = 1;  // 1..numSeats or 'dealer'

// ── API helper ──
async function api(endpoint, method='GET', body=null) {
  const opts = {method, headers: {'Content-Type':'application/json'}};
  if (body) opts.body = JSON.stringify({sid: SID, ...body});
  const url = method === 'GET' && SID
    ? `/api/${endpoint}?sid=${SID}` : `/api/${endpoint}`;
  const r = await fetch(url, opts);
  return r.json();
}

// ── Setup modal: update my-seat options ──
function updateSeatOptions() {
  const n = +document.getElementById('setup-seats').value;
  const sel = document.getElementById('setup-my-seat');
  const current = +sel.value;
  sel.innerHTML = '';
  for (let i = 1; i <= n; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = 'Бокс ' + i;
    sel.appendChild(opt);
  }
  sel.value = Math.min(current, n);
  document.getElementById('my-seat-field').style.display = n > 1 ? '' : 'none';
}

// ── Init ──
async function initSession() {
  const bankroll = +document.getElementById('setup-bankroll').value || 1000;
  const min_bet = +document.getElementById('setup-min').value || 10;
  const max_bet = +document.getElementById('setup-max').value || 500;
  numSeats = +document.getElementById('setup-seats').value || 1;
  mySeat = numSeats > 1 ? (+document.getElementById('setup-my-seat').value || 1) : 1;

  const data = await api('init', 'POST', {bankroll, min_bet, max_bet});
  SID = data.sid;
  updateUI(data.state);
  document.getElementById('setup-modal').classList.remove('open');
  log('Сессия начата. Банкролл $' + bankroll +
      (numSeats > 1 ? ' | ' + numSeats + ' игроков, твой бокс ' + mySeat : ''));
  initSeats();
  buildCardGrids();
}

// ── Seat management ──
function initSeats() {
  seatCards = {};
  for (let i = 1; i <= numSeats; i++) {
    seatCards[i] = [];
  }
  dealerCard = null;
  activeSeatIndex = 1;
  hitMode = false;
  buildSeatsUI();
}

function buildSeatsUI() {
  const container = document.getElementById('seats-container');
  let html = '';
  for (let i = 1; i <= numSeats; i++) {
    const isActive = activeSeatIndex === i && !hitMode;
    const isMine = i === mySeat;
    const cards = seatCards[i] || [];
    const label = numSeats === 1 ? 'Игрок' : ('Бокс ' + i + (isMine ? ' ★' : ''));
    html += '<div class="seat-row' + (isActive ? ' active' : '') + (isMine ? ' my-seat' : '') + '"'
         + ' onclick="selectSeat(' + i + ')">'
         + '<span class="seat-indicator">' + (isActive ? '→' : '') + '</span>'
         + '<span class="seat-label">' + label + '</span>'
         + '<span class="seat-cards">' + (cards.join(' ') || '—') + '</span>'
         + '<button class="seat-clear" onclick="event.stopPropagation();clearSeat(' + i + ')">C</button>'
         + '</div>';
  }
  // Dealer row
  const dealerActive = activeSeatIndex === 'dealer' && !hitMode;
  html += '<div class="seat-row dealer-row' + (dealerActive ? ' active' : '') + '"'
       + ' onclick="selectSeat(\'dealer\')">'
       + '<span class="seat-indicator">' + (dealerActive ? '→' : '') + '</span>'
       + '<span class="seat-label">Дилер</span>'
       + '<span class="seat-cards">' + (dealerCard || '—') + '</span>'
       + '<button class="seat-clear" onclick="event.stopPropagation();clearDealer()">C</button>'
       + '</div>';

  // Hit mode indicator
  if (hitMode) {
    const myCards = seatCards[mySeat] || [];
    html += '<div style="text-align:center;padding:4px;font-size:11px;color:var(--blue)">'
         + 'Хит → Бокс ' + mySeat + ' (' + myCards.join(' ') + ')</div>';
  }

  container.innerHTML = html;
}

function selectSeat(idx) {
  if (hitMode) return; // during hit, input goes to my seat only
  activeSeatIndex = idx;
  buildSeatsUI();
}

function clearSeat(idx) {
  seatCards[idx] = [];
  activeSeatIndex = idx;
  buildSeatsUI();
}

function clearDealer() {
  dealerCard = null;
  activeSeatIndex = 'dealer';
  buildSeatsUI();
}

function clearAllSeats() {
  for (let i = 1; i <= numSeats; i++) {
    seatCards[i] = [];
  }
  dealerCard = null;
  activeSeatIndex = 1;
  hitMode = false;
  document.getElementById('btn-hit').disabled = true;
  document.getElementById('btn-deal').disabled = false;
  buildSeatsUI();
}

function advanceToNextSeat() {
  if (typeof activeSeatIndex === 'number') {
    const next = activeSeatIndex + 1;
    if (next <= numSeats) {
      activeSeatIndex = next;
    } else {
      activeSeatIndex = 'dealer';
    }
  }
  // If dealer card is already set, don't advance
}

// ── Card grids ──
function buildCardGrids() {
  ['hand-card-grid','count-card-grid'].forEach(id => {
    const grid = document.getElementById(id);
    grid.innerHTML = '';
    CARDS.forEach(c => {
      const btn = document.createElement('div');
      btn.className = 'card-btn';
      btn.textContent = c;
      btn.dataset.card = c;
      btn.onclick = () => onCardTap(c, id);
      grid.appendChild(btn);
    });
  });
}

function cardRank(c) {
  if (c === 'T') return '10';
  return c;
}

function onCardTap(card, gridId) {
  const rank = cardRank(card);
  if (gridId === 'hand-card-grid') {
    if (hitMode) {
      doHit(rank);
      return;
    }
    if (activeSeatIndex === 'dealer') {
      dealerCard = rank;
      // Don't auto-advance from dealer
      buildSeatsUI();
    } else {
      seatCards[activeSeatIndex].push(rank);
      // Auto-advance after 2 cards
      if (seatCards[activeSeatIndex].length >= 2) {
        advanceToNextSeat();
      }
      buildSeatsUI();
    }
  } else {
    countCards.push(rank);
    document.getElementById('count-display').textContent = countCards.join(' ') || '—';
  }
}

function clearCountCards() {
  countCards = [];
  document.getElementById('count-display').textContent = '—';
}

// ── Deal ──
async function dealHand() {
  const myCards = seatCards[mySeat] || [];
  if (myCards.length < 2 || !dealerCard) {
    log('Нужно минимум 2 карты на твоём боксе + дилер', 'alert');
    return;
  }

  // Collect other players' cards
  let otherCards = [];
  for (let i = 1; i <= numSeats; i++) {
    if (i !== mySeat && seatCards[i].length > 0) {
      otherCards = otherCards.concat(seatCards[i]);
    }
  }

  const data = await api('new_hand', 'POST', {
    player_cards: myCards,
    dealer_up: dealerCard,
    other_cards: otherCards,
  });
  if (data.error) { log(data.error, 'bad'); return; }

  updateUI(data.state);

  if (data.blackjack) {
    showAction('BLACKJACK!', '', 'action-stand');
    log('Блэкджек!', 'good');
    hitMode = false;
    return;
  }

  let extra = '';
  if (data.insurance) {
    extra = 'БЕРИ СТРАХОВКУ!';
    log('TC >= +3: БЕРИ СТРАХОВКУ', 'good');
  }

  const cls = actionClass(data.action);
  showAction(data.action_name, extra, cls);

  if (data.reason === 'deviation') {
    log('Девиация! Базовая стратегия: ' + data.basic_would_be, 'alert');
  }

  const logParts = ['Рука: ' + myCards.join(' ') + ' vs ' + dealerCard + ' → ' + data.action_name];
  if (otherCards.length > 0) {
    logParts.push('(+' + otherCards.length + ' карт со стола)');
  }
  log(logParts.join(' '));

  hitMode = true;
  activeSeatIndex = mySeat;
  document.getElementById('btn-hit').disabled = false;
  document.getElementById('btn-deal').disabled = true;
  buildSeatsUI();
}

// ── Hit ──
async function hitCard() {
  hitMode = true;
  activeSeatIndex = mySeat;
  buildSeatsUI();
  showAction('Нажми карту...', 'Хит', 'action-hit');
}

async function doHit(rank) {
  const data = await api('hit', 'POST', {card: rank});
  if (data.error) { log(data.error, 'bad'); return; }

  seatCards[mySeat].push(rank);
  buildSeatsUI();
  updateUI(data.state);

  if (data.bust) {
    showAction('БAСТ ' + data.hand_value, '', 'action-surrender');
    log('Бaст: ' + data.hand_value, 'bad');
    hitMode = false;
    document.getElementById('btn-hit').disabled = true;
    buildSeatsUI();
    return;
  }
  if (data.twenty_one) {
    showAction('21!', 'Стэнд', 'action-stand');
    log('21!', 'good');
    hitMode = false;
    document.getElementById('btn-hit').disabled = true;
    buildSeatsUI();
    return;
  }

  const cls = actionClass(data.action);
  showAction(data.action_name, '', cls);
  log('Хит ' + rank + ' → ' + data.hand_value + ' → ' + data.action_name);
}

// ── Count ──
async function submitCount() {
  if (countCards.length === 0) return;
  const data = await api('count', 'POST', {cards: countCards});
  updateUI(data.state);
  log('Считали ' + countCards.length + ' карт: ' + countCards.join(' '));
  clearCountCards();
}

// ── Results ──
async function submitResult(type) {
  const st = window._lastState;
  const bet = st ? st.bet_ramp : 10;
  let amount = 0;
  if (type === 'win') amount = bet;
  else if (type === 'loss') amount = -bet;
  else if (type === 'bj') amount = bet * 1.5;
  else amount = 0;

  const data = await api('result', 'POST', {amount});
  updateUI(data.state);
  const cls = amount > 0 ? 'good' : amount < 0 ? 'bad' : '';
  log('Результат: $' + (amount > 0 ? '+' : '') + amount, cls);
  clearAllSeats();
  updateStats(data.state);
}

async function submitResultCustom() {
  const el = document.getElementById('result-amount');
  const amount = parseFloat(el.value) || 0;
  const data = await api('result', 'POST', {amount});
  updateUI(data.state);
  const cls = amount > 0 ? 'good' : amount < 0 ? 'bad' : '';
  log('Результат: $' + (amount > 0 ? '+' : '') + amount, cls);
  el.value = '';
  clearAllSeats();
  updateStats(data.state);
}

// ── Shoe reset ──
async function resetShoe() {
  const data = await api('shoe_reset', 'POST', {});
  updateUI(data.state);
  log('Новый шуз', 'important');
  clearAllSeats();
}

// ── Zones ──
async function loadZones() {
  const data = await api('zones', 'GET');
  const panel = document.getElementById('zones-panel');
  if (!data.zones || data.zones.length === 0) {
    panel.innerHTML = '<div style="color:var(--dim);font-size:13px">Нет зон — играйте руки для отслеживания</div>';
    return;
  }
  let html = '<div class="section-title">Зоны текущего шуза (' + data.total_cards + ' карт)</div>';
  data.zones.forEach(z => {
    const cls = z.favorable ? 'fav' : z.unfavorable ? 'unfav' : 'neut';
    const label = z.favorable ? 'TEN-RICH' : z.unfavorable ? 'ten-poor' : 'neutral';
    const color = z.favorable ? 'var(--green)' : z.unfavorable ? 'var(--red)' : 'var(--dim)';
    html += `<div class="zone-bar">
      <div class="zone-indicator ${cls}"></div>
      <span>Z${z.index}</span>
      <span>${z.size} карт</span>
      <span style="color:${color}">RC=${z.rc > 0 ? '+' : ''}${z.rc}</span>
      <span style="color:${color};margin-left:auto;font-weight:600">${label}</span>
    </div>`;
  });
  panel.innerHTML = html;
}

// ── Shuffle ──
function openShuffleModal() {
  document.getElementById('shuffle-modal').classList.add('open');
}
function closeShuffleModal() {
  document.getElementById('shuffle-modal').classList.remove('open');
}

async function submitShuffle() {
  const num_stacks = +document.getElementById('shuf-stacks').value;
  const riffles = +document.getElementById('shuf-riffles').value;
  const quality = document.getElementById('shuf-quality').value;
  const has_strip = document.getElementById('shuf-strip').value === 'true';

  const data = await api('shuffle', 'POST', {num_stacks, riffles, quality, has_strip});
  closeShuffleModal();

  if (data.error) { log(data.error, 'bad'); return; }

  updateUI(data.state);
  renderPredictions(data.predictions, 0);
  log('Шафл проанализирован: retention=' + data.retention + '%', 'important');

  const noriff = data.predictions.filter(p => !p.riffled).length;
  if (noriff) log(noriff + ' секций НЕ рифлились — 100% retention!', 'good');

  clearAllSeats();
  setMode('shuffle');
}

function renderPredictions(preds, currentSec) {
  const panel = document.getElementById('predictions-panel');
  if (!preds || preds.length === 0) {
    panel.innerHTML = '<div style="color:var(--dim);font-size:13px">Нет предсказаний — используйте "Шафл анализ"</div>';
    return;
  }
  let html = '<div class="section-title">Предсказания для нового шуза</div>';
  preds.forEach(p => {
    const cls = (p.favorable ? ' favorable' : p.unfavorable ? ' unfavorable' : '') +
                (p.section === currentSec ? ' current' : '');
    let tag = '';
    if (!p.riffled) tag = '<span class="pred-tag noriff">НЕ РИФЛ</span>';
    else if (p.favorable) tag = '<span class="pred-tag rich">BET BIG</span>';
    else if (p.unfavorable) tag = '<span class="pred-tag poor">MIN</span>';

    html += `<div class="prediction-row${cls}">
      <span class="pred-section">${p.section}</span>
      <span class="pred-count" style="color:${p.est_count < -1 ? 'var(--green)' : p.est_count > 1 ? 'var(--red)' : 'var(--dim)'}">
        ${p.est_count > 0 ? '+' : ''}${p.est_count}
      </span>
      <span style="color:var(--dim);font-size:11px">~${p.est_cards} карт</span>
      <span class="pred-conf">${p.confidence}%</span>
      ${tag}
    </div>`;
  });
  panel.innerHTML = html;
}

async function nextSection() {
  const data = await api('next_section', 'POST', {});
  if (data.error) { log(data.error, 'bad'); return; }
  updateUI(data.state);
  if (data.state.predictions && data.state.predictions.length) {
    renderPredictions(data.state.predictions, data.state.current_section);
  }
  log('Секция ' + data.state.current_section + ' (signal: ' + data.state.section_signal + ')');
}

// ── UI helpers ──
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.mode === mode));
  document.querySelectorAll('.mode-panel').forEach(p =>
    p.style.display = 'none');
  document.getElementById('mode-' + mode).style.display = '';
  if (mode === 'zones') loadZones();
  if (mode === 'shuffle' && window._lastState) {
    const s = window._lastState;
    if (s.predictions && s.predictions.length) {
      renderPredictions(s.predictions, s.current_section);
    }
  }
  if (mode === 'result' && window._lastState) {
    updateStats(window._lastState);
  }
}

function showAction(main, sub, cls) {
  const area = document.getElementById('action-area');
  area.innerHTML = `<div class="action-main ${cls || ''}">${main}</div>` +
    (sub ? `<div class="action-sub">${sub}</div>` : '');
}

function actionClass(action) {
  return {
    'H': 'action-hit', 'S': 'action-stand', 'D': 'action-double',
    'P': 'action-split', 'R': 'action-surrender',
  }[action] || '';
}

function updateUI(state) {
  if (!state) return;
  window._lastState = state;

  // TC
  const tcEl = document.getElementById('tc');
  tcEl.textContent = (state.tc >= 0 ? '+' : '') + state.tc.toFixed(1);
  tcEl.className = 'stat-value ' + (state.tc >= 1 ? 'positive' : state.tc < 0 ? 'negative' : 'neutral');

  // RC
  document.getElementById('rc').textContent = (state.rc >= 0 ? '+' : '') + state.rc;

  // Edge
  const edgeEl = document.getElementById('edge');
  edgeEl.textContent = (state.edge >= 0 ? '+' : '') + state.edge.toFixed(2) + '%';
  edgeEl.className = 'stat-value ' + (state.edge > 0 ? 'positive' : 'negative');

  // Bet
  document.getElementById('bet').textContent = '$' + state.bet_ramp;

  // Bankroll
  const brEl = document.getElementById('bankroll');
  brEl.textContent = '$' + state.bankroll;

  // Penetration
  document.getElementById('pen').textContent = state.penetration + '%';

  // Wong
  const wongEl = document.getElementById('wong');
  wongEl.textContent = state.wong.toUpperCase().replace('_', ' ');
  wongEl.className = 'wong-badge wong-' + state.wong;

  // Shuffle signal
  const sigEl = document.getElementById('shuffle-signal');
  if (state.section_signal === 'big') {
    sigEl.className = 'shuffle-signal big';
    sigEl.textContent = 'SHUFFLE TRACK: TEN-RICH — BET BIG';
  } else if (state.section_signal === 'min') {
    sigEl.className = 'shuffle-signal min';
    sigEl.textContent = 'SHUFFLE TRACK: ten-poor — bet minimum';
  } else {
    sigEl.className = 'shuffle-signal';
  }

  // Warnings
  if (state.should_leave) {
    log('STOP LOSS — Пора уходить!', 'bad');
  }
  if (state.hit_win_goal) {
    log('WIN GOAL — Фиксируй прибыль!', 'good');
  }
}

function updateStats(state) {
  const el = document.getElementById('stats-display');
  if (!el || !state) return;
  const wr = state.hands_played > 0 ? (state.hands_won / state.hands_played * 100).toFixed(1) : '—';
  el.innerHTML = `
    Рук: ${state.hands_played} | W: ${state.hands_won} L: ${state.hands_lost} P: ${state.hands_pushed}<br>
    Win rate: ${wr}% | P/L: <span style="color:${state.net_profit >= 0 ? 'var(--green)' : 'var(--red)'}">$${state.net_profit >= 0 ? '+' : ''}${state.net_profit}</span><br>
    Банкролл: $${state.bankroll}
  `;
}

function log(msg, cls) {
  const el = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry' + (cls ? ' ' + cls : '');
  const time = new Date().toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  entry.textContent = time + '  ' + msg;
  el.prepend(entry);
  while (el.children.length > 50) el.lastChild.remove();
}

// ── Keyboard shortcut for quick card entry ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const key = e.key.toUpperCase();
  const cardKeys = {'1':'A','0':'10','T':'10','J':'J','Q':'Q','K':'K'};
  let card = cardKeys[key] || (/^[2-9]$/.test(key) ? key : null);
  if (card) {
    if (currentMode === 'hand') onCardTap(card === '10' ? 'T' : card, 'hand-card-grid');
    else if (currentMode === 'count') onCardTap(card === '10' ? 'T' : card, 'count-card-grid');
  }
});

// Build grids and default seats on load
buildCardGrids();
initSeats();
</script>
</body>
</html>
